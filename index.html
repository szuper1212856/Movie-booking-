<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Házimozi - Foglalás</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #eee;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #222;
      padding: 1em;
      font-size: 1.5em;
    }
    .movie {
      margin: 20px auto;
      width: 90%;
      max-width: 600px;
      background: #333;
      border-radius: 10px;
      padding: 20px;
    }
    .seats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 20px;
      justify-items: center;
    }
    .seat {
      width: 40px;
      height: 40px;
      background-color: green;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .seat.booked {
      background-color: red;
      cursor: not-allowed;
    }
    form {
      margin-top: 20px;
    }
    input[type="text"] {
      padding: 8px;
      width: 80%;
      max-width: 300px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    🎥 Házimozi - Foglalás
  </header>

  <div id="movies"></div>

  <footer>
    &copy; 2025 Saját Mozi rendszer - Balazs
  </footer>

  <script>
    const movies = [
      {
        title: "Bogyó és Babóca 7. – Mesék a pöttyös ház",
        desc: "A Bogyó és Babóca 7. - Mesék a pöttyös házból című mozifilm Bogyó, a csigafiú, Babóca, a katicalány és barátaik kedves kalandjait mutatják be. A mesék úgy követik egymást a mozifilmben, mintha egy gyerektársaságban mindenki elmesélné a többieknek a legkedvesebb történetét. Minden történet különösen is fontos valamelyik szereplő számára, például Baltazár megtanulja, miért kell szabályosan közlekedni, Bogyó bűvésszé válik, Alfonz pedig új barátra lel. A korábbi epizódokhoz képest ebben a sorozatban gyakrabban bukkannak fel a gyerekek számára különösen izgalmas járművek, egy tűzoltóautó, egy kukásautó, és még egy igazi gőzmozdony is.  A már korábban megismert és megkedvelt szereplők mellett újak is feltűnnek: az elkóborolt csemetéjét kereső Béka, Zengő, az üvegszárnyú lepkelány, Légy Lajos, az optikus, aki Döme, a krumplibogár számára készít szemüveget, a lomtalanításban segítő fürgebogarak, a hős tűzoltóbogarak, a szerencsét hozó füstbogár-kéményseprő és a vonatvezető skarlátbogár.",
        img: "https://via.placeholder.com/400x200",
        key: "bogyoesbaboca"
      },
      {
        title: "János Vitéz (2025)",
        desc: "A János Vitéz 2025 verzója.",
        img: "https://via.placeholder.com/400x200?text=Janos+Vitez",
        key: "janosvitez"
      },
      {
        title: "Véletlenül néztem egy filmet",
        desc: "Kérdezd meg a mozi főnököt",
        img: "https://via.placeholder.com/400x200?text=Veletlen+Film",
        key: "veletlenfilm"
      }
    ];

    const container = document.getElementById("movies");

    movies.forEach(movie => {
      const div = document.createElement("div");
      div.className = "movie";
      div.innerHTML = `
        <h2>${movie.title}</h2>
        <img src="${movie.img}" alt="${movie.title}" style="width: 100%; border-radius: 10px;">
        <p><strong>Leírás:</strong> ${movie.desc}</p>
        <form data-key="${movie.key}">
          <label for="name-${movie.key}">Név:</label><br>
          <input type="text" id="name-${movie.key}" required><br>
          <div class="seats"></div>
          <button type="submit">Foglalás</button>
        </form>
      `;

      const seatGrid = div.querySelector(".seats");
      const rows = 4, cols = 6;
      const bookings = JSON.parse(localStorage.getItem("bookings-" + movie.key) || "[]");

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const seatId = `${String.fromCharCode(65 + row)}${col + 1}`;
          const seat = document.createElement("button");
          seat.textContent = seatId;
          seat.classList.add("seat");
          if (bookings.find(b => b.seat === seatId)) {
            seat.classList.add("booked");
            seat.disabled = true;
          }
          seat.dataset.seat = seatId;
          seat.addEventListener("click", function(e) {
            seatGrid.querySelectorAll(".seat.selected").forEach(s => s.classList.remove("selected"));
            seat.classList.add("selected");
          });
          seatGrid.appendChild(seat);
        }
      }

      div.querySelector("form").addEventListener("submit", function(e) {
        e.preventDefault();
        const nameInput = this.querySelector("input");
        const name = nameInput.value.trim();
        const selected = seatGrid.querySelector(".seat.selected");
        if (!name || !selected) {
          alert("Kérjük adja meg a nevét és válasszon egy széket.");
          return;
        }
        bookings.push({ name, seat: selected.dataset.seat });
        localStorage.setItem("bookings-" + movie.key, JSON.stringify(bookings));
        alert(`Sikeres foglalás: ${selected.dataset.seat}`);
        location.reload();
      });

      container.appendChild(div);
    });
  </script>
</body>
</html>
